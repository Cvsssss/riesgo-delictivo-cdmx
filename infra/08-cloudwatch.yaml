AWSTemplateFormatVersion: "2010-09-09"
Description: riesgo-delictivo-cdmx - Monitoreo con CloudWatch - alarmas de errores y duracion de las dos Lambdas, aviso por correo y un tablero.

Parameters:
  ProjectName:
    Type: String
    Default: riesgo-delictivo-cdmx
    Description: Debe ser el mismo valor usado en las plantillas 01 a 07
    AllowedPattern: "^[a-z0-9-]{3,30}$"
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  CorreoAlertas:
    Type: String
    Description: Correo al que llegan los avisos de las alarmas
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  UmbralDuracionMs:
    Type: Number
    Default: 600000
    Description: Duracion maxima aceptada de la transformacion (10 minutos; es el umbral de cambio a Glue del ADR 0002)

Resources:
  TemaAlertas:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-alertas"
      Subscription:
        - Protocol: email
          Endpoint: !Ref CorreoAlertas

  AlarmaErroresIngesta:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-ingesta-errores"
      AlarmDescription: La Lambda de ingesta fallo al menos una vez
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub "${ProjectName}-${Environment}-ingesta"
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref TemaAlertas]

  AlarmaErroresTransformacion:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-transformacion-errores"
      AlarmDescription: La Lambda de transformacion fallo al menos una vez
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub "${ProjectName}-${Environment}-transformacion"
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref TemaAlertas]

  AlarmaDuracionTransformacion:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-transformacion-duracion"
      AlarmDescription: La transformacion tardo mas del umbral del ADR 0002 (se acerca el momento de evaluar Glue)
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Sub "${ProjectName}-${Environment}-transformacion"
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: !Ref UmbralDuracionMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref TemaAlertas]

  Tablero:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${ProjectName}-${Environment}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
             "properties": {"title": "Errores por ejecucion", "region": "${AWS::Region}", "stat": "Sum", "period": 3600, "view": "timeSeries",
               "metrics": [["AWS/Lambda", "Errors", "FunctionName", "${ProjectName}-${Environment}-ingesta"],
                           ["AWS/Lambda", "Errors", "FunctionName", "${ProjectName}-${Environment}-transformacion"]]}},
            {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
             "properties": {"title": "Duracion maxima (ms)", "region": "${AWS::Region}", "stat": "Maximum", "period": 3600, "view": "timeSeries",
               "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${ProjectName}-${Environment}-ingesta"],
                           ["AWS/Lambda", "Duration", "FunctionName", "${ProjectName}-${Environment}-transformacion"]]}}
          ]
        }

Outputs:
  TemaAlertasArn:
    Value: !Ref TemaAlertas
  NombreAlarmaPrueba:
    Description: Alarma que puedes usar para probar el aviso por correo
    Value: !Ref AlarmaErroresTransformacion
